<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Céleste"><meta name="theme-color" content="#120a26">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-180.png">
<title>Céleste</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2b1856,#0c0618 60%,#05030b);color:#f2eaff;font-family:Georgia,serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 40px rgba(160,107,255,.6),0 0 0 2px rgba(242,207,126,.7)}
h1{margin:0;font-weight:400;color:#f2cf7e;font-size:28px;letter-spacing:.04em}
p{margin:0;max-width:340px;line-height:1.4;color:#e3d2ff}
input{width:100%;max-width:320px;box-sizing:border-box;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(222,180,100,.6);background:rgba(15,6,32,.8);color:#fff;text-align:center}
button{font-size:18px;padding:12px 28px;border-radius:99px;border:0;background:linear-gradient(180deg,#fbe3a5,#e2b25a);color:#1b0d33;font-weight:700}
#etat{min-height:1.4em;color:#f6d78f}
</style></head><body><main>
<img src="icone-512.png" alt="">
<h1>Céleste</h1>
<p>Application privée de L’Étoile du Berger Céleste. Tapez votre clé personnelle (4 mots) pour l’ouvrir sur cet appareil.</p>
<form id="f"><input id="cle" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="votre clé (4 mots)" required></form>
<button form="f" type="submit">Ouvrir</button>
<p id="etat"></p>
<p style="font-size:13px;opacity:.6">version <span id="version"></span> · <a href="#" id="recommencer" style="color:#f6d78f">recommencer</a></p>
</main>
<script>
'use strict';
const etat = document.getElementById('etat');
const CACHE = 'celeste-app';
const versionLocale = () => caches.open(CACHE).then(c => c.match(new URL('app/version.txt', location.href).href)).then(r => r ? r.text() : '');
async function versionDistante() { try { const r = await fetch('version.txt', { cache: 'no-store' }); return r.ok ? (await r.text()).trim() : ''; } catch (e) { return ''; } }
async function demarrer() {
  if (!('serviceWorker' in navigator) || !window.caches || !crypto.subtle) { etat.textContent = 'Cet appareil ne permet pas d’ouvrir l’application.'; return; }
  await navigator.serviceWorker.register('sw.js');
  const [locale, distante] = await Promise.all([versionLocale(), versionDistante()]);
  if (locale && (!distante || locale.trim() === distante)) { location.replace('app/index.html'); return; }
  if (locale) etat.textContent = 'Une nouvelle version est prête : entrez la clé pour la mettre à jour.';
}
const normaliser = p => p.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-+|-+$/g, '');
async function ouvrir(phrase) {
  if (/^[0-9a-z]{4}-?[0-9a-z]{4}-?[0-9a-z]{4}$/i.test(phrase.trim()) && /[0-9]/.test(phrase)) {
    throw new Error('Ceci est une clé de paiement : elle se tape plus tard, dans « J’ai une clé », sur l’écran de Céleste. Ici, tapez votre clé de 4 mots.');
  }
  etat.textContent = 'Ouverture…';
  const [serr, brut] = await Promise.all([fetch('serrures.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('paquet.bin', { cache: 'no-store' }).then(r => r.arrayBuffer()).then(b => new Uint8Array(b))]);
  if (String.fromCharCode(...brut.slice(0, 4)) !== 'EBC2') throw new Error('paquet inconnu');
  const sel = Uint8Array.from(atob(serr.sel), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normaliser(phrase)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sel, iterations: serr.tours }, base, 256);
  const kHmac = await crypto.subtle.importKey('raw', bits, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const rep = Array.from(new Uint8Array(await crypto.subtle.sign('HMAC', kHmac, new TextEncoder().encode('repere'))).slice(0, 8), x => x.toString(16).padStart(2, '0')).join('');
  const serrure = serr.serrures.find(x => x.id === rep);
  if (!serrure) throw new Error('clé incorrecte');
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const kek = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const brutDonnees = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(serrure.iv), additionalData: new TextEncoder().encode('serrure') }, kek, b64(serrure.env));
  const cle = await crypto.subtle.importKey('raw', brutDonnees, 'AES-GCM', false, ['decrypt']);
  const clair = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: brut.slice(4, 16) }, cle, brut.slice(16)));
  const n = new DataView(clair.buffer).getUint32(0), index = JSON.parse(new TextDecoder().decode(clair.slice(4, 4 + n))), corps = 4 + n;
  const c = await caches.open(CACHE);
  for (const f of index) {
    const r = new Response(clair.slice(corps + f.o, corps + f.o + f.n), { headers: { 'Content-Type': f.t } });
    await c.put(new URL('app/' + f.p, location.href).href, r);
  }
  await navigator.serviceWorker.ready;
  etat.textContent = 'C’est prêt.';
  location.replace('app/index.html');
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  ouvrir(document.getElementById('cle').value).catch(e => { etat.textContent = e.message === 'clé incorrecte'
    ? 'Clé incorrecte : vérifiez les 4 mots (les accents et les majuscules ne comptent pas).' : (e.message.startsWith('Ceci') ? e.message : 'Ouverture impossible : ' + e.message); });
});
document.getElementById('recommencer').addEventListener('click', async ev => {
  ev.preventDefault();
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace(location.pathname + '?r=' + Date.now());
});
versionDistante().then(v => { document.getElementById('version').textContent = v || 'hors ligne'; });
demarrer();
</script></body></html>
