<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Céleste"><meta name="theme-color" content="#120a26">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-180.png">
<title>Céleste</title>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#2b1856,#0c0618 60%,#05030b);color:#f2eaff;font-family:Georgia,serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 40px #a06bff66,0 0 0 2px #f2cf7eaa}
h1{margin:0;font-weight:400;color:#f2cf7e;font-size:28px}p{margin:0;max-width:360px;line-height:1.5}
button{font-size:18px;padding:12px 25px;border-radius:99px;border:0;background:#f2cf7e;color:#1b0d33;cursor:pointer}
[hidden]{display:none!important}small{opacity:.65}
</style></head><body><main>
<img src="icone-512.png" alt=""><h1>Céleste</h1>
<p id="etat" role="status" aria-live="polite" hidden>Ouverture de Céleste…</p>
<button id="reessayer" hidden>Réessayer</button>
<button id="continuer" hidden>Ouvrir la version disponible</button>
<small id="version" hidden></small>
</main><script>
'use strict';
const etat = document.getElementById('etat');
const META = 'celeste-runtime', LEGACY = 'celeste-app', PREFIX = 'celeste-app-';
const POINTER = new URL('.celeste-version', location.href).href;
const versionValide = v => /^\d{8}-\d{6}$/.test(v);
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
let enCours = false;
async function borner(p, ms) {
  let timer;
  try { return await Promise.race([p, new Promise((_,ko) => { timer = setTimeout(() => ko(new Error('delai')), ms); })]); }
  finally { clearTimeout(timer); }
}
async function lire(url, type, ms = 12000) {
  const c = new AbortController(), timer = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, {cache:'no-store', signal:c.signal});
    if (!r.ok) throw new Error('telechargement');
    return await r[type]();
  } finally { clearTimeout(timer); }
}
async function versionLocale() {
  const meta = await caches.open(META), p = await meta.match(POINTER);
  const v = p && (await p.text()).trim();
  const cache = await caches.open(versionValide(v) ? PREFIX + v : LEGACY);
  const r = await cache.match(new URL('app/version.txt', location.href).href);
  const locale = r && (await r.text()).trim();
  return versionValide(locale) && await cache.match(new URL('app/index.html',location.href).href) ? locale : '';
}
async function installer(serr, brut, version) {
  if (serr.v !== 2 || serr.accesDirect?.mode !== 'public' ||
      serr.accesDirect.version !== version || String.fromCharCode(...brut.slice(0,4)) !== 'EBC2') throw new Error('paquet');
  const bits = b64(serr.accesDirect.base64);
  if (bits.length !== 32) throw new Error('paquet');
  const kek = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const envelope = serr.accesDirect;
  const dataKey = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(envelope.iv), additionalData:new TextEncoder().encode('acces-public')}, kek, b64(envelope.env));
  const cle = await crypto.subtle.importKey('raw',dataKey,'AES-GCM',false,['decrypt']);
  const clair = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:brut.slice(4,16)},cle,brut.slice(16)));
  const n = new DataView(clair.buffer).getUint32(0);
  if (n < 2 || n > 2000000 || n > clair.length-4) throw new Error('index');
  const index = JSON.parse(new TextDecoder().decode(clair.slice(4,4+n))), corps=4+n, noms=new Set();
  if (!Array.isArray(index) || index.length>5000) throw new Error('index');
  for (const f of index) {
    if (typeof f.p!=='string' || !f.p || f.p.startsWith('/') || f.p.includes('\\') || f.p.split('/').some(x=>!x||x==='.'||x==='..') ||
        noms.has(f.p) || !Number.isSafeInteger(f.o) || !Number.isSafeInteger(f.n) || f.o<0 || f.n<0 || corps+f.o+f.n>clair.length) throw new Error('index');
    noms.add(f.p);
  }
  const vf=index.find(f=>f.p==='version.txt');
  if (!noms.has('index.html') || !vf || new TextDecoder().decode(clair.slice(corps+vf.o,corps+vf.o+vf.n))!==version) throw new Error('version');
  const nom = PREFIX+version;
  // Le même identifiant désigne toujours les mêmes octets. Un autre onglet peut
  // avoir fini d'installer cette version : ne jamais supprimer son cache actif.
  {
    const c = await caches.open(nom);
    for (const f of index) await c.put(new URL('app/'+f.p,location.href).href,
      new Response(clair.slice(corps+f.o,corps+f.o+f.n),{headers:{'Content-Type':f.t}}));
    const meta=await caches.open(META);
    await meta.put(POINTER,new Response(version));
  }
}
async function ouvrir() { location.replace('app/index.html?ouverture='+Date.now()); }
async function attendreControle(registration) {
  const cible = registration.installing || registration.waiting || registration.active;
  if (cible && cible.state !== 'activated') await borner(new Promise((ok,ko) => {
    const verifier = () => {
      if (cible.state === 'activated' || cible.state === 'redundant') {
        cible.removeEventListener('statechange',verifier);
        cible.state === 'activated' ? ok() : ko(new Error('worker'));
      }
    };
    cible.addEventListener('statechange',verifier); verifier();
  }),15000);
  if (!navigator.serviceWorker.controller || navigator.serviceWorker.controller !== registration.active)
    await borner(new Promise(ok => {
      const verifier = () => {
        if (navigator.serviceWorker.controller && navigator.serviceWorker.controller === registration.active) {
          navigator.serviceWorker.removeEventListener('controllerchange',verifier); ok();
        }
      };
      navigator.serviceWorker.addEventListener('controllerchange',verifier); verifier();
    }),10000);
}
async function demarrer() {
  if (enCours) return; enCours=true;
  etat.hidden=true;
  document.getElementById('reessayer').hidden=true;
  document.getElementById('continuer').hidden=true;
  let locale='';
  try {
    if (!('serviceWorker' in navigator) || !window.caches || !crypto.subtle) throw new Error('appareil');
    locale=await versionLocale();
    const registration=await borner(navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}),15000);
    await borner(navigator.serviceWorker.ready,15000);
    await attendreControle(registration);
    let distante='';
    try { distante=(await lire('version.txt','text')).trim(); } catch(e) { if(locale) return ouvrir(); throw e; }
    if (!versionValide(distante)) throw new Error('version');
    document.getElementById('version').textContent='Version '+distante;
    if (locale===distante) return ouvrir();
    etat.textContent=locale ? 'Mise à jour de Céleste…' : 'Préparation de Céleste… Le premier téléchargement peut prendre un moment.';
    if (locale) document.getElementById('continuer').hidden=false;
    const suffixe='?v='+encodeURIComponent(distante);
    const [serr,buf]=await Promise.all([lire('serrures.json'+suffixe,'json'),lire('paquet.bin'+suffixe,'arrayBuffer',90000)]);
    await installer(serr,new Uint8Array(buf),distante);
    try { if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{}); } catch(e) {}
    return ouvrir();
  } catch(e) {
    if(locale) return ouvrir();
    etat.hidden=false;
    etat.textContent=e.message==='appareil' ? 'Ouvre Céleste dans un navigateur récent, avec le stockage autorisé.' : 'Le chargement n’a pas abouti. Vérifie ta connexion et réessaie.';
    document.getElementById('reessayer').hidden=false;
  } finally { enCours=false; }
}
document.getElementById('reessayer').addEventListener('click',demarrer);
document.getElementById('continuer').addEventListener('click',ouvrir);
demarrer();
</script></body></html>
